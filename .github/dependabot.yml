version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compatible-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      ai-sdk-migration:
        patterns:
          - ai
          - '@ai-sdk/*'
          - '@openrouter/ai-sdk-provider'
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
